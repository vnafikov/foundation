version: '2'

linters:
  enable:
    - asasalint
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - errorlint
    - exptostd
    - fatcontext
    - gocritic
    - gosec
    - iface
    - intrange
    - iotamixing
    - mirror
    - modernize
    - nilnesserr
    - noctx
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - protogetter
    - reassign
    - revive
    - tagliatelle
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  settings:
    decorder:
      dec-order:
        - const
        - var
        - type
        - func
      disable-dec-order-check: false
      disable-init-func-first-check: false

    errcheck:
      check-type-assertions: true

    fatcontext:
      check-struct-pointers: true
      check-loops: false
      check-function-literals: false

    gocritic:
      # See https://go-critic.com/overview.
      enable-all: true
      disabled-checks:
        - hugeParam
        - singleCaseSwitch
        - unnecessaryBlock

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    iface:
      enable:
        - identical
        - opaque
        - unexported

    iotamixing:
      report-individual: true

    paralleltest:
      check-cleanup: true

    revive:
      # See https://github.com/mgechev/revive?tab=readme-ov-file#available-rules.
      enable-all-rules: true
      confidence: 0
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: deep-exit
          disabled: true
        - name: enforce-map-style
          arguments:
            - make
        - name: enforce-repeated-arg-type-style
          arguments:
            - short
        - name: enforce-slice-style
          arguments:
            - literal
        - name: enforce-switch-style
          disabled: true
        - name: exported
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: function-length
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: line-length-limit
          arguments:
            - 140
        - name: max-public-structs
          disabled: true
        - name: multiline-if-init
          disabled: true
        - name: nested-structs
          disabled: true
        - name: package-comments
          disabled: true
        - name: unchecked-type-assertion
          arguments:
            - accept-ignored-assertion-result: true
        - name: unhandled-error
          arguments:
            - strings\.Builder\.Write.*
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true

    staticcheck:
      checks:
        - all
        - -ST1000 # Incorrect or missing package comment.
        - -ST1020 # The documentation of an exported function should start with the function's name.
        - -ST1021 # The documentation of an exported type should start with type's name.
        - -ST1022 # The documentation of an exported variable or constant should start with variable's name.
        - -QF1001 # Apply De Morgan's law.

    tagliatelle:
      case:
        rules:
          json: camel
          yaml: camel
          xml: camel
          toml: camel
          bson: camel
          avro: snake
          mapstructure: camel
          env: upperSnake
          envconfig: upperSnake
          whatever: snake
        use-field-name: true

    usetesting:
      os-mkdir-temp: false
      os-temp-dir: true

  exclusions:
    rules:
      - linters:
          - gofumpt
        text: File is not properly formatted
      - linters:
          - revive
        text: 'unnecessary-stmt: switch with only one case can be replaced by an if-then'
      # Local rules.
      - path: infrastructure/http/server/router/handlers/request/basehandlercontext.go
        linters:
          - containedctx
      - path: infrastructure/ws/server/presenters
        linters:
          - decorder
        text: type must not be placed after func
      - linters:
          - revive
        text: "package-naming: don't use \"json\" because it conflicts with common Go standard library package \"encoding/json\"|\
          var-naming: don't use underscores in Go names; type Lookup_ should be Lookup"

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - gci

  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any

    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true

    gci:
      sections:
        - standard
        - default
        - localmodule
        - alias
        - dot
        - blank
      custom-order: true
